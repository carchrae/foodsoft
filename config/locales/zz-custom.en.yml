# Custom locale keys for our patch series (new keys only — wording OVERRIDES of
# upstream en.yml keys also belong here, so upstream locale changes never conflict).
# The zz- prefix keeps this file loading after en.yml; the filename deliberately
# does not match the `{??,???}{-*,}.yml` available_locales glob, so it adds no
# phantom locale.
en:
  articles:
    form:
      recalculate_price: Recalculate Price
  documents:
    order_by_articles:
      filename: Order %{name}-%{date} - by articles
      title: 'Order sorted by articles: %{name}, closed at %{date}'
    order_by_groups:
      filename: Bin Sheets %{name} - %{date}
      sum: Estimated Total (may be adjusted depending on actual received and spoilage)
      title: '%{name} Order - %{date} - ordering by %{user_name}'
    order_matrix:
      filename: Splitsheets %{name}-%{date}
      heading: Delivery Checklist Page
      rows:
        - Article
        - Unit
        - Unit quantity
        - Unit Price
        - Case Price
        - Cases
        - Count/Weight
        - Spoilage (%)
      title: 'Split sheets: %{name} - %{date} - Ordered by %{user_name}'
      note: ''
    order_fax:
      rows:
        - SKU
        - Cases
        - Name
        - Price
        - Subtotal
      deliver_on: 'Delivery On: %{date}'
      ordered_on: 'Order Date: %{date}'
  orders:
    fax:
      delivery_day: 'Delivery On: %{date}'
    model:
      error_not_closed: Order isn't already settled
      notice_reopen: 'Order: %{name} - %{ends} (reopened)'
    index:
      upcoming_orders: Upcoming
    articles:
      prices: Net/gross/supplier price
    show:
      swap-articles: Swap articles
    swap:
      title: 'Swap articles: %{name}'
      updated_order: The order has been updated with any substitutions
      order_closed: You cannot change an order after it is closed.  Make any changes by editing the article on %{url}
    form:
      note_placeholder: add any notes to be shown for co-op members
      supplier_note_placeholder: add any instructions to be emailed to the supplier
  activerecord:
    attributes:
      article:
        supplier_price: Supplier price
      order:
        supplier_note: Supplier note
        split_effort: Splits
      ordergroup:
        available_funds: Available funds
  finance:
    balancing:
      group_order_articles:
        total_fc: Charged to members
        total_supplier: Total paid to supplier
      reopen:
        alert: 'An error occured while reopening: %{message}'
        notice: Order was reopened succesfully, the balances of members account have been refunded.
      new:
        confirm_reopen_order: Reopen Order
  helpers:
    tasks:
      required_users_unconfirmed: "%{count} members have not confirmed"
  mailer:
    order_result:
      subject: 'Order %{name} %{pickup}'
      html0: |
        Dear %{user},
        <br/>
        <p>%{message}</p>
        <p>%{orderuser}</p>
      html1: |-
        o Total sum: %{sum}

        You can view the order online: %{order_url}

        Kind regards from %{foodcoop}.
    order_result_supplier:
      text: |
        Hello,

        %{foodcoop} would like to place an order.  Find our order attached.  Please confirm receipt.

        %{supplier_note}

        Kind regards,
        %{user}
  shared:
    article_fields_price:
      price_warning: Supplier price does not equal Price * Unit.  You can use the 'Recalculate Price' button to update the price.
    upcoming_orders:
      title: Upcoming orders
      no_upcoming_orders: There are no upcoming orders
    closed_orders:
      title: Closed
      no_closed_orders: There are no orders to show
      who_ordered: Who ordered?
      total_sum: Total cost
      not_enough_apples: Attention your ordergroup has too few apple points to place an order!
  js:
    shared:
      article_fields_price:
        price_already_correct: This button lets you quickly recalculate the price = (supplier price/unit), however the price is already correct.
  login:
    join:
      title: Join our food-coop
      body: |
        <p>
        Would you like to join our food-coop?
        </p>
        <p>
        Please read our new members guide to understand more about how our co-op operates.
        <br/> <a class="btn btn-info" target="_blank" href="https://docs.google.com/document/d/e/2PACX-1vSZ_XkP-7bNZ6S5tfMFKRClYpmaNRJABV992MMjO3FuR8VxXxyZCGw1BANVd8lNwvjDjbHBxYrgHhWa/pub">Learn</a>
        </p>
        <p>
        If it sounds like the co-op is a good fit for you and your family, then please apply by filling out this form
        <br/>
        <a href="https://forms.gle/AaNWmUacArMY6moH6" class="btn btn-success">Apply</a>
        </p>
        <p>
        We would like you to understand that the co-op does not always take on new members as we want to keep the size managable.
        That said, if you do not hear back from us (sometimes we are busy or miss emails) please email mlbg-membership@googlegroups.com
        </p>
  sessions:
    new:
      join: Join our coop
