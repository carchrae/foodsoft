# Development compose file.
#
# Assumes postgres (localhost:5432) and redis (localhost:6379) already run as
# separate containers on this machine (see ../bin/docker-db.sh). The app
# container uses host networking so the localhost connection strings from
# local-settings.sh work unchanged.
#
# Launch with ./start-docker-dev.sh — it sources local-settings.sh and passes
# DATABASE_URL / SHARED_DATABASE_URL through to the container.
#
# The resque worker is optional; start it with:
#   ./start-docker-dev.sh --profile worker

services:

  foodsoft:
    build: &build
      context: .
      dockerfile: Dockerfile-dev
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    command: ./proc-start web
    network_mode: host
    environment: &env
      - DATABASE_URL=${DATABASE_URL:-postgres://food-coop:food-coop@localhost:5432/food-coop}
      - SHARED_DATABASE_URL=${SHARED_DATABASE_URL:-postgres://food-coop:food-coop@localhost:5432/food-prices}
      - REDIS_URL=redis://localhost:6379
      - PORT=3000
    volumes:
      - bundle:/home/app/bundle
      - .:/home/app/src

  foodsoft_worker:
    profiles: [worker]
    build: *build
    command: ./proc-start worker
    network_mode: host
    environment: *env
    volumes:
      - bundle:/home/app/bundle
      - .:/home/app/src

volumes:
  bundle:
